name: Publish To Modrinth

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Modrinth version number, for example 1.0.1"
        required: true
      changelog:
        description: "Optional changelog text"
        required: false
      release_type:
        description: "Modrinth release type: release, beta, or alpha"
        required: false
        default: "release"

permissions:
  contents: read

env:
  MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
  MODRINTH_GAME_VERSIONS: ${{ vars.MODRINTH_GAME_VERSIONS || '1.21.11' }}
  MODRINTH_LOADERS: ${{ vars.MODRINTH_LOADERS || 'paper,purpur,spigot' }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Modrinth settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_PROJECT_ID}" ]]; then
            echo "Missing repository variable MODRINTH_PROJECT_ID"
            exit 1
          fi
          if [[ -z "${{ secrets.MODRINTH_TOKEN }}" ]]; then
            echo "Missing repository secret MODRINTH_TOKEN"
            exit 1
          fi

      - name: Build plugin
        run: mvn -B clean package

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)"
          if [[ -z "${jar_path}" ]]; then
            echo "No packaged jar found in target/"
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="${RELEASE_TAG#v}"
            display_name="${RELEASE_NAME}"
            if [[ -z "${display_name}" ]]; then
              display_name="BestSleep ${version}"
            fi
            changelog="${RELEASE_BODY}"
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              release_type="beta"
            else
              release_type="release"
            fi
          else
            version="${INPUT_VERSION#v}"
            display_name="BestSleep ${version}"
            changelog="${INPUT_CHANGELOG}"
            release_type="${INPUT_RELEASE_TYPE:-release}"
          fi

          {
            echo "jar_path=${jar_path}"
            echo "jar_name=$(basename "${jar_path}")"
            echo "version=${version}"
            echo "display_name=${display_name}"
            echo "release_type=${release_type}"
            echo "changelog<<EOF"
            echo "${changelog}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION_NUMBER: ${{ steps.meta.outputs.version }}
          VERSION_NAME: ${{ steps.meta.outputs.display_name }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
          RELEASE_TYPE: ${{ steps.meta.outputs.release_type }}
          JAR_PATH: ${{ steps.meta.outputs.jar_path }}
          USER_AGENT: ${{ github.repository }}/github-actions
        run: |
          set -euo pipefail

          python3 - <<'PY' > modrinth-data.json
          import json
          import os

          def csv_env(name: str):
              return [item.strip() for item in os.environ[name].split(",") if item.strip()]

          payload = {
              "name": os.environ["VERSION_NAME"],
              "version_number": os.environ["VERSION_NUMBER"],
              "changelog": os.environ.get("CHANGELOG", ""),
              "dependencies": [],
              "game_versions": csv_env("MODRINTH_GAME_VERSIONS"),
              "version_type": os.environ["RELEASE_TYPE"],
              "loaders": csv_env("MODRINTH_LOADERS"),
              "project_id": os.environ["MODRINTH_PROJECT_ID"],
              "file_parts": ["file"],
              "primary_file": "file",
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          curl --fail-with-body \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: ${USER_AGENT}" \
            -F "data=@modrinth-data.json;type=application/json" \
            -F "file=@${JAR_PATH}" \
            https://api.modrinth.com/v2/version
